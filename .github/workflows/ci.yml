name: CI

# PR / push 级别的前置检查 ── 合并前拦截类型错误、单测回归与 Rust 编译失败。
# 发版流水线见 release.yml（tag 驱动，跨平台打包）。
#
# 设计原则：先保证"绿灯可跑"，再逐步收紧。
#   - clippy 暂不加 `-D warnings`（代码库历史较长，尚未确认是否 clippy-clean）；
#     待清理干净后可改为 `cargo clippy --workspace --all-targets -- -D warnings` 升级为阻断式。
#   - 可选后续：加 `cargo fmt --check`（需先统一格式）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsh:
    name: DSH · packaging invariants
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify native dependency selection and binary headers
        run: npm run test:dsh:packaging

      - name: DSH App Server tests
        run: |
          npm --prefix dsh-appserver ci --ignore-scripts
          npm --prefix dsh-appserver test

  web:
    name: Web · typecheck + unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@10.8.2 --no-audit --no-fund

      - name: Check package manager policy
        run: |
          test "$(npm --version)" = "10.8.2"
          npm run check:package-manager

      - name: Install dependencies
        run: npm ci

      - name: Protected note rename boundary
        run: |
          npm run check:note-rename-boundaries
          npm run test:note-rename-boundaries

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Desktop web production build
        run: npm run build

      - name: Desktop web bundle budgets
        run: npm run check:web-bundle

      # `flowix embed` prints a catalog generated from lib/html-embed-api.ts.
      # Without this gate the CLI happily ships a catalog that no longer matches
      # the kinds the page SDK actually answers.
      - name: Embed capability catalog is generated
        run: npm run check:embed-catalog

      - name: Layer boundaries
        run: npm run check:layers

      - name: Architecture boundaries (policy + baseline)
        run: npm run check:arch

      - name: Lint
        run: npm run lint

      - name: Frontend debt ratchets
        run: npm run check:frontend-debt

      - name: Unit tests
        run: npm test

      # 真实 Chromium 里跑三条冒烟（打包后白屏 / 保存链路 / Agent 渲染安全）。
      # ubuntu-22.04 runner 预装 google-chrome，探针会自己找到它。
      - name: Browser smoke tests
        run: npm run smoke

  rust:
    name: Rust · clippy + tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/target -> ci

      - name: Stage Flowix CLI sidecar for Tauri checks
        run: npm run cli:build:dev

      - name: Clippy
        working-directory: app
        run: cargo clippy --workspace --all-targets

      # 与前端 `check:arch` 对等的一道闸门：模块回边、文件行数上限、壳/域重心比。
      # 只读源码，不需要 cargo，跑完 1 秒。
      - name: Rust architecture (policy + baseline)
        run: npm run check:rust-arch

      - name: Tests
        working-directory: app
        # Keep environment-sensitive integration tests (notably DSH/Wry) out
        # of the baseline workspace gate. They have a dedicated manual job.
        run: cargo test --workspace --lib
