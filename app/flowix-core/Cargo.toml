[package]
name = "flowix-core"
version.workspace = true
description = "Flowix business core: notebook / memo storage, search, threads. Zero Tauri dependency."
authors = ["you"]
edition.workspace = true
license.workspace = true

[lib]
name = "flowix_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
walkdir = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
nanoid = { workspace = true }
dunce = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
fs2 = { workspace = true }
# Notebook-template installation unpacks an untrusted ZIP, so the deflate
# reader lives next to the validation rules instead of in the shell.
# `deflate-flate2-zlib-rs` rather than the bare `deflate-flate2`: the latter
# leaves flate2 without a compression backend, which only compiles when another
# crate in the graph happens to turn one on. zlib-rs is pure Rust, so `cargo
# check -p flowix-core` stays self-contained on every platform.
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
same-file = "1"
diffy = "0.5.2"
pulldown-cmark = { version = "0.13", default-features = false }
percent-encoding = "2.3"
url = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }
