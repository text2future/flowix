[package]
name = "flowix-cli"
version = "1.5.4"
description = "Flowix 命令行工具 ── 共享同一份 memo_file 存储, 跟桌面端 watcher 双向同步"
authors = ["Flowix Contributors"]
edition.workspace = true
default-run = "flowix-cli"

[[bin]]
name = "flowix-cli"
path = "src/main.rs"

[dependencies]
flowix-core = { workspace = true }
flowix-plugin-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
nanoid = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
shell-words = { workspace = true }
rusqlite = { workspace = true }

# Windows 专用: 启动时把 console codepage 切到 UTF-8, 非 Windows 不构建。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
