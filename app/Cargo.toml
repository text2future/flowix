[workspace]
resolver = "2"
members = [
    "flowix-desktop",
    "flowix-core",
    "flowix-plugin-runtime",
    "flowix-sync",
    "flowix-cli",
]

# 锁定共用依赖到同一版本 ── 避免 backend / cli 走不一致版本。
[workspace.package]
version = "1.3.6"
edition = "2021"

# 锁定共用依赖到同一版本 ── 避免 backend / cli 走不一致版本。
[workspace.dependencies]
flowix-core = { path = "flowix-core" }
flowix-plugin-runtime = { path = "flowix-plugin-runtime" }
flowix-sync = { path = "flowix-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
walkdir = "2.4"
regex = "1.10"
once_cell = "1.19"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
nanoid = "0.4"
dunce = "1.0"
tempfile = "3"
fs2 = "0.4"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
semver = "1"
minisign-verify = "0.2"
clap = { version = "4.5", features = ["std"] }
clap_complete = "4.5"
shell-words = "1.1"
# Windows console codepage 切 UTF-8 用 ── 仅 flowix-cli 直接依赖。
# Win32_Foundation 必须开: SetConsoleCP/SetConsoleOutputCP 返回 BOOL, 被该 feature 门控。
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }

# ── 生产体积优化（release 专用，不影响 dev 调试）──────────────────────────────
# 作用：去掉符号表 + 跨 crate 死代码消除 + 单代码生成单元，明显缩小二进制。
# 安全说明：
#   - strip 只作用于 bin / cdylib 产物；staticlib / rlib 不受影响。
#   - opt-level 保持默认 3，不牺牲运行时性能。
#   - 崩溃符号化依赖未 strip 的归档产物；发布流水线请保留一份未 strip 的二进制。
#   - lto 用 thin（而非 fat），平衡编译时长与稳定性。
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
